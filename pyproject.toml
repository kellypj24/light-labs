[project]
name = "light-labs"
version = "0.1.0"
description = "PJ's local AI lab: robots on local models, evals to decide what leaves the cloud"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lab = "light_labs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["light_labs"]

[tool.ruff]
line-length = 100
