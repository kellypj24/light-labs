# Boss fight: Roll deciding what in PJ's mail archive is worth keeping.
#
# Task class: given one archived email's sender, subject, Gmail category, unsubscribe
# header and snippet, return keep/<class> or discard/<class> (docs/roll-keep-plan.md).
# The costly mistake is a keep labelled discard: that mail is later offered for deletion.
# Everything here is synthetic: example.org/.com/.net senders, invented people. Seeded from
# the 2026-10-19 cleanup misses, rewritten.
#
# Run:  just eval mail-keep mega-man
stage: mail-keep
robot: Roll

# Fixed before the first run; recorded on every sample. Procedure: the boss-fight skill.
# The weapon also needs zero keep->discard misses on the finance, security and health
# fixtures; read that off the report until the marts break it out.
bar:
  min_fixture_rate: 0.90
  max_gap: 0.05
  reason: >
    Labels decide what PJ is offered for deletion, and a kept bank, security or health
    email labelled discard can be lost; held at the lab default until shadow labelling
    on real archived mail says otherwise.

