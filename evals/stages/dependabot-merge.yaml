# Boss fight: Roll deciding whether a Dependabot PR merges with no human review.
#
# Task class: given a Dependabot PR's title, version jump, changed files, CI state and
# release notes, answer yes/no to "safe to merge with no human review?" by token
# probability (chores.answer, the call `lab roll chores` records). Label merge/hold.
# The costly mistake is a merge where the label is hold: it lands unreviewed.
# Fixtures are real PRs from PJ's public repos (Dependabot output is public), written by
# `lab roll chores-fixtures` from Roll's record: the label is Claude's verdict, or PJ's
# when PJ merged or closed the PR himself (`source`). Category is the review tier.
#
# Run:  just eval dependabot-merge mega-man,proto-14b,bass
stage: dependabot-merge
robot: Roll

# Fixed before the first run; recorded on every sample. Procedure: the boss-fight skill.
# The weapon also needs zero hold->merge misses in the tier it is earned for; read that
# off the report until the marts break it out. Earned per tier, patch first.
bar:
  min_fixture_rate: 0.95
  max_gap: 0.05
  reason: >
    A wrong merge lands unreviewed in a repo PJ ships from, so the bar is above the lab
    default (PJ 2026-10-29: 0.95 agreement and zero false yeses, per tier).

