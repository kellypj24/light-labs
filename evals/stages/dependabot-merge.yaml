  - {"id": "data_engineering_249", "category": "minor", "source": "claude", "input": {"number": 249, "title": "chore(deps): Bump dagster-snowflake from 0.29.25 to 0.29.26 in /orchestration/dagster", "package": "dagster-snowflake", "from": "0.29.25", "to": "0.29.26", "directory": "/orchestration/dagster", "jump": "patch", "tier": "minor", "files": ["orchestration/dagster/uv.lock"], "checks": "pass", "mergeable": "MERGEABLE", "head": "f8c9733c09b199509741bdc7de2def15e6959de9", "branch": "dependabot/uv/orchestration/dagster/dagster-snowflake-0.29.26", "body": "Bumps [dagster-snowflake](https://github.com/dagster-io/dagster) from 0.29.25 to 0.29.26.\n<details>\n<summary>Changelog</summary>\n<p><em>Sourced from <a href=\"https://github.com/dagster-io/dagster/blob/master/CHANGES.md\">dagster-snowflake's changelog</a>.</em></p>\n<blockquote>\n<h2>1.13.26 (core) / 0.29.26 (libraries)</h2>\n<h3>Breaking Changes</h3>\n<ul>\n<li>[dagster-dbt] <code>dagster-dbt</code> no longer installs <code>dbt-core</code>. It is now available as the <code>dagster-dbt[dbt-core]</code> extra. Do not install <code>dbt-core</code> into an environment that also has dbt Fusion's <code>dbt</code> PyPI package: both claim the <code>dbt</code> import namespace and overwrite each other's files, and pip reports no error.</li>\n</ul>\n<h3>New</h3>\n<ul>\n<li>Sensor ticks that request a run larger than the instance's run size limit now fail with an explicit error naming the offending run requests, instead of storing those requests in tick history.</li>\n<li>The <code>SF_PARTNER_ID</code> environment variable is now set by default, to allow for partner attribution on Snowflake connections made through third-party libraries.</li>\n<li>Run monitoring now includes the run worker's debug info (for example, a Kubernetes <code>OOMKilled</code> termination reason) when it fails a started run because the run worker failed. (Thanks, <a href=\"https://github.com/hosaka2\"><code>@​hosaka2</code></a>!)</li>\n<li>[dg] <code>dg list envs</code>, <code>dg plus create env</code>, and <code>dg plus pull env</code> now accept a <code>--deployment</code> option (or the <code>DAGSTER_CLOUD_DEPLOYMENT</code> environment variable) to target a deployment other than the configured default.</li>\n<li>[dagster-cloud] The published <code>dagster-cloud-agent</code> image now includes the Azure Container Apps launcher.</li>\n<li>[dagster-dbt] A dbt Fusion binary on <code>PATH</code> is now used as-is, instead of being shadowed by the <code>dbt</code> entry point that <code>dbt-core</code> installs into the virtualenv.</li>\n<li>[dagster-dbt] <code>fetch_column_metadata()</code> and <code>fetch_row_counts()</code> no longer fail the step when running on the dbt Fusion engine, or when dbt adapter initialization fails. They now log a warning and emit events without the metadata.</li>\n<li>[dagster-dbt] <code>dagster-dbt</code>'s <code>sqlglot</code> dependency no longer pins an upper bound. Column lineage generation now works on sqlglot 28.1 and later, including the performance improvements in 30.x for wide models.</li>\n<li>[dagster-dbt] Asset materializations from dbt runs now carry the node's dbt status as metadata.</li>\n</ul>\n<h3>Bugfixes</h3>\n<ul>\n<li>GraphQL event-log, tick, and run-record queries no longer fail when the requested limit exceeds the server-side default. The limit is clamped to the default, and the remaining rows are available by paginating.</li>\n<li>Fixed a bug where a run's asset list could be under-reported in the UI for runs with a large number of materializations, and"}, "expect": {"label": "merge"}}
