c/pydantic/pull/13967\">#13967</a></li>\n<li>Enforce the <code>max_digits</code> whole-digits limit in the Python <code>Decimal</code> validator by <a href=\"https://github.com/Viicos\"><code>@​Viicos</code></a> in <a href=\"https://redirect.github.com/pydantic/pydantic/pull/13972\">#13972</a></li>\n<li>Reject out-of-range int inputs for <code>timedelta</code> by <a href=\"https://github.com/Viicos\"><code>@​Viicos</code></a> in <a href=\"https://redirect.github.com/pydantic/pydantic/pull/13973\">#13973</a></li>\n<li>Support named tuples in <code>Sequence</code> validation by <a href=\"https://github.com/Viicos\"><code>@​Viicos</code></a> in <a href=\"https://redirect.github.com/pydantic/pydantic/pull/13978\">#13978</a></li>\n</ul>\n<p><strong>Full Changelog</strong>: <a href=\"https://github.com/pydantic/pydantic/compare/v2.14.0...v2.14.1\">https://github.com/pydantic/pydantic/compare/v2.14.0...v2.14.1</a></p>\n<h2>v2.14.0 2026-10-08</h2>\n<h3>What's Changed</h3>\n<p>The highlights of the v2.14 release are available in the <a href=\"https://pydantic.dev/articles/pydantic-v2-14-release\">blog post</a>.\nSeveral minor changes (considered non-breaking changes according to our <a href=\"https://pydantic.dev/docs/validation/2.14/get-started/version-policy/#pydantic-v2\">versioning policy</a>) are also included in this release. Make sure to look into them before upgrading.</p>\n<p>This release drops support for Python 3.9 and adds support for Python 3.15.</p>\n<h4>New Features</h4>\n<ul>\n<li>Add support for <code>multiple_of</code> constraint in <code>fraction</code> and <co"}, "expect": {"label": "merge"}}
