dg list envs</code>, <code>dg plus create env</code>, and <code>dg plus pull env</code> now accept a <code>--deployment</code> option (or the <code>DAGSTER_CLOUD_DEPLOYMENT</code> environment variable) to target a deployment other than the configured default.</li>\n<li>[dagster-cloud] The published <code>dagster-cloud-agent</code> image now includes the Azure Container Apps launcher.</li>\n<li>[dagster-dbt] A dbt Fusion binary on <code>PATH</code> is now used as-is, instead of being shadowed by the <code>dbt</code> entry point that <code>dbt-core</code> installs into the virtualenv.</li>\n<li>[dagster-dbt] <code>fetch_column_metadata()</code> and <code>fetch_row_counts()</code> no longer fail the step when running on the dbt Fusion engine, or when dbt adapter initialization fails. They now log a warning and emit events without the metadata.</li>\n<li>[dagster-dbt] <code>dagster-dbt</code>'s <code>sqlglot</code> dependency no longer pins an upper bound. Column lineage generation now works on sqlglot 28.1 and later, including the performance improvements in 30.x for wide models.</li>\n<li>[dagster-dbt] Asset materializations from dbt runs now carry the node's dbt status as metadata.</li>\n</ul>\n<h3>Bugfixes</h3>\n<ul>\n<li>GraphQL event-log, tick, and run-record queries no longer fail when the requested limit exceeds the server-side default. The limit is clamped to the default, and the remaining rows are available by paginating.</li>\n<li>Fixed a bug where a run's asset list could be under-reported in the UI for runs with a large number of materializations, and where an a"}, "expect": {"label": "merge"}}
  - {"id": "data_engineering_253", "category": "major", "source": "claude", "input": {"number": 253, "title": "chore(deps-dev): Bump ruff from 0.16.10 to 0.17.0 in /orchestration/dagster", "package": "ruff", "from": "0.16.10", "to": "0.17.0", "directory": "/orchestration/dagster", "jump": "major", "tier": "major", "files": ["orchestration/dagster/uv.lock"], "checks": "pass", "mergeable": "MERGEABLE", "head": "09bf1b6cf93f2ad72b0784de2307673523a5e404", "branch": "dependabot/uv/orchestration/dagster/ruff-0.17.0", "body": "Bumps [ruff](https://github.com/astral-sh/ruff) from 0.16.10 to 0.17.1.\n<details>\n<summary>Release notes</summary>\n<p><em>Sourced from <a href=\"https://github.com/astral-sh/ruff/releases\">ruff's releases</a>.</em></p>\n<blockquote>\n<h2>0.17.1</h2>\n<h2>Release Notes</h2>\n<p>Released on 2026-10-15.</p>\n<h3>Preview features</h3>\n<ul>\n<li>[<code>pycodestyle</code>] Don't treat <code>None</code>, <code>True</code>, or <code>False</code> as keywords (<code>E271</code>-<code>E274</code>) (<a href=\"https://redirect.github.com/astral-sh/ruff/pull/29322\">#29322</a>)</li>\n</ul>\n<h3>Bug fixes</h3>\n<ul>\n<li>Fix dedent with multiple leading comments (<a href=\"https://redirect.github.com/astral-sh/ruff/pull/29382\">#29382</a>)</li>\n<li>[<code>flake8-pyi</code>] Detect legacy positional-only parameters in <code>__new__</code> methods (<code>PYI063</code>) (<a href=\"https://redirect.github.com/astral-sh/ruff/pull/28502\">#28502</a>)</li>\n<li>[<code>flake8-pyi</code>] Fix false positives on quoted annotations (<code>PYI036</code>) (<a href=\"https://redirect.github.com/astral-sh/ruff/pull/29274\">#29274</a>)</li>\n<li>[<code>perflint</code>] Avoid invalid comprehension suggestions (<code>PERF401</code>, <code>PERF403</code>) (<a href=\"https://redirect.github.com/astral-sh/ruff/pull/29366\">#29366</a>)</li>\n</ul>\n<h3>Rule changes</h3>\n<ul>\n<li>Treat more <code>collections</code> and <code>weakref</code> containers as mutable (<a href=\"https:/