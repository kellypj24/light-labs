ithub.com/PrefectHQ/prefect/pull/23278\">#23278</a></li>\n<li>Fix automation edit crash for flow-run triggers with non-state events by <a href=\"https://github.com/devin-ai-integration\"><code>@​devin-ai-integration</code></a>[bot] in <a href=\"https://redirect.github.com/PrefectHQ/prefect/pull/23218\">#23218</a></li>\n<li>Pass the configured botname to <code>NotifyMattermost</code> by <a href=\"https://github.com/Ayoubhm07\"><code>@​Ayoubhm07</code></a> in <a href=\"https://redirect.github.com/PrefectHQ/prefect/pull/23281\">#23281</a></li>\n<li>Stop truncating runner names that contain dots by <a href=\"https://github.com/fbossiere\"><code>@​fbossiere</code></a> in <a href=\"https://redirect.github.com/PrefectHQ/prefect/pull/23195\">#23195</a></li>\n<li>Fix nested schema <code>required</code> list leaking onto sibling properties in <code>process_properties</code> by <a href=\"https://github.com/devin-ai-integration\"><code>@​devin-ai-integration</code></a>[bot] in <a href=\"https://redirect.github.com/PrefectHQ/prefect/pull/23192\">#23192</a></li>\n<li>Don't reschedule a flow run the server already finished on SIGTERM by <a href=\"https://github.com/devin-ai-integration\"><code>@​devin-ai-integration</code></a>[bot] in <a href=\"https://redirect.github.com/PrefectHQ/prefect/pull/23244\">#23244</a></li>\n<li>Keep the worker healthcheck healthy while the API is in maintenance by <a href=\"https://github.com/jimid27\"><code>@​jimid27</code></a> in <a href=\"https://redirect.github.com/PrefectHQ/prefect/pull/23230\">#23230</a></li>\n<li>Keep event persister peri"}, "expect": {"label": "hold"}}
