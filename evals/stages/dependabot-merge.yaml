  - {"id": "data_engineering_260", "category": "patch", "source": "claude", "input": {"number": 260, "title": "chore(deps): Bump dbt-core from 1.12.5 to 1.12.6 in /transformation/dbt", "package": "dbt-core", "from": "1.12.5", "to": "1.12.6", "directory": "/transformation/dbt", "jump": "patch", "tier": "patch", "files": ["transformation/dbt/uv.lock"], "checks": "pass", "mergeable": "MERGEABLE", "head": "913b619fd1410e9e1a473e395f6779367c0b7d94", "branch": "dependabot/uv/transformation/dbt/dbt-core-1.12.6", "body": "Bumps [dbt-core](https://github.com/dbt-labs/dbt-core) from 1.12.5 to 1.12.6.\n<details>\n<summary>Release notes</summary>\n<p><em>Sourced from <a href=\"https://github.com/dbt-labs/dbt-core/releases\">dbt-core's releases</a>.</em></p>\n<blockquote>\n<h2>dbt v1.12.6</h2>\n<h2>dbt-core 1.12.6 - October 14, 2026</h2>\n<h3>Features</h3>\n<ul>\n<li>Announce dbt v2 availability as an INFO message on <code>dbt --version</code>, with a link to the v2 install docs (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n</ul>\n<h3>Fixes</h3>\n<ul>\n<li>Relay the v2 (Fusion) parser's log output via --log-format otel instead of json-compat, dropping span noise, keeping fusion's error/warning codes, and fixing a latent bug where a stray fusion stderr line could abort the run under --warn-error (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n<li>Bare wildcard FQN selectors (e.g. <code>-s &quot;f_*&quot;</code>) now match nested models regardless of subfolder depth (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n<li>Fix cumulative metrics with an <code>input_metric</code> and a top-level <code>window</code> field (v2 metric spec) incorrectly failing to parse with a legacy nested-<code>type_params</code> error (<a href=\"https://github.com/dbt-labs/dbt-core/issues/N/A\">#N/A</a>)</li>\n<li>Fix compiled_code not persisted to manifest.json when using --use-v2-parser (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n<li>Include <code>semantic_manifest.json</code> in the artifact set uploaded by <code>--upload-to-artifacts-ingest-api</code>, matching other run artifacts (<a href=\"https://github.com/dbt-labs/dbt-core/issues/N/A\">#N/A</a>)</li>\n<li>Validate that tarball package download locations stay within the dbt downloads directory (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n</ul>\n<h3>Under the Hood</h3>\n<ul>\n<li>Rename internal &quot;Fusion&quot; naming to &quot;v2&quot; for the v2 parser integration (exceptions, module, and test names); no user-facing behavior change (<a href=\"https://github.com/dbt-labs/dbt-core/issues/N/A\">#N/A</a>)</li>\n</ul>\n<h3>Contributors</h3>\n<ul>\n<li><a href=\"https://github.com/\">@</a> (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n<li><a href=\"https://github.com/aiguofer\"><code>@​aiguofer</code></a> (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>, <a href=\"https://github.com/dbt-labs/dbt-core/issues/N/A\">#N/A</a>)</li>\n<li><a href=\"https://github.com/ash2shukla\"><code>@​ash2shukla</code></a> (<a href=\"https://github.com/dbt-labs/dbt-core/issues/N/A\">#N/A</a>, <a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n<li><a href=\"https://github.com/ayshukla\"><code>@​ayshukla</code></a> (<a href=\"https://github.com/dbt-labs/dbt-core/issues/N/A\">#N/A</a>)</li>\n<li><a href=\"https://github.com/itsnamangoyal\"><code>@​itsnamangoyal</code></a> (<a href=\"https://github.com/dbt-labs/dbt-core/issues/\">#</a>)</li>\n<li><a href=\""}, "expect": {"label": "hold"}}
