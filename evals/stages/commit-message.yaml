      reference: 'feat: run health and live progress for fights


        PJ''s backlog from the dbt-model fight that heated the laptop: save as

        you go, know when and why a run stopped and how hot it ran, and see

        progress instead of dots.


        - **Save as you go**: every sample is appended to `<run_id>.jsonl` when

        it finishes.

        - **Run record** `<run_id>.run.json` (atomic rewrite after each sample):

        running / completed / cancelled, reason, progress, harness errors,

        cooling pauses. Ctrl-C or SIGTERM cancels cleanly (exit 130, partial

        report). `lab evals cancel <run_id> --reason` records why, and closes a

        killed run.

        - **Telemetry** every 30 s: battery °C and %, AC, macOS CPU speed limit,

        load, Ollama CPU; nil on platforms without the reading (CI).

        - **Cooldown**: `-cool-above <°C>` waits before a sample while hot or

        throttled.

        - **Progress**: one line per sample (position, pass/FAIL, each

        contestant''s running score, elapsed, time left, °C); `just watch` for a

        live view from a second terminal.

        - **Analytics**: `raw.eval_run_log`, `raw.eval_telemetry` →

        `mart_run_health` (outcome incl. abandoned, peak °C, throttling, time on

        battery).'
