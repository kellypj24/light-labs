      diff: "diff --git a/CLAUDE.md b/CLAUDE.md\nindex 1b13572..eac4aff 100644\n--- a/CLAUDE.md\n+++ b/CLAUDE.md\n\
        @@ -10,7 +10,7 @@ This is a composable collection of data engineering tools organized by role:\n\
        \ - `tooling/` — Developer-side tools a project adopts alongside a stack: git hooks, review, dataset\
        \ diffs (see `tooling/_template/README.md`)\n - `stacks/` — Pre-assembled combinations (airbyte-dagster-dbt,\
        \ dlt-dagster-dbt, dlt-temporal-dbt)\n - `infrastructure/` — Shared Docker/Terraform. `terraform/modules/snowflake_rbac/`\
        \ is the Snowflake role/grant module (read its README for the future-grant precedence rule); `terraform/snowflake/`\
        \ uses it\n-- `docs/` — Architecture patterns, tool comparison matrices, `patterns/` write-ups,\
        \ and the two roadmaps\n+- `docs/` — Architecture patterns, tool comparison matrices, `patterns/`\
        \ write-ups, `adr/` (architecture decision records: read before reversing a structural choice; supersede,\
        \ never edit), and the two roadmaps\n - `archive/` — Previous experiments (reference only, not maintained)\n\
        \ \n ## Conventions\ndiff --git a/docs/adr/0001-uv-for-python.md b/docs/adr/0001-uv-for-python.md\n\
        new file mode 100644\nindex 0000000..1be9c3f\n--- /dev/null\n+++ b/docs/adr/0001-uv-for-python.md\n\
        @@ -0,0 +1,21 @@\n+# 0001. `uv` for every Python tool\n+\n+- Status: Accepted\n+- Date: 2026-10-07\n\
        +\n+## Context\n+Each tool is independent and carries its own dependencies. pip with\n+requirements\
        \ files gives no lock, so builds drift; poetry locks but is slow and\n+has its own resolver quirks.\
        \ Dependabot's `pip` ecosystem edited\n+`pyproject.toml` without touching the lock, so the declared\
        \ floors and the\n+locked versions drifted apart and PR titles misreported versions.\n+\n+## Decision\n\
        +Every Python tool has a `pyproject.toml` and a committed `uv.lock`. All commands\n+run through\
        \ `uv` (`uv sync`, `uv run`, `uv lock`). Dependabot uses the `uv`\n+ecosystem, and CI's `lockfiles`\
        \ job runs `uv lock --check` for every tool.\n+\n+## Consequences\n+Installs are fast and reproducible,\
        \ and a lock that disagrees with its\n+`pyproject.toml` fails CI. Contributors need `uv` installed.\
        \ There is no\n+`requirements.txt` anywhere, so tools that expect one need an export step.\ndiff\
        \ --git a/docs/adr/0002-just-modules-per-tool.md b/docs/adr/0002-just-modules-per-tool.md\nnew file\
        \ mode 100644\nindex 0000000..7eb792f\n--- /dev/null\n+++ b/docs/adr/0002-just-modules-per-tool.md\n\
        @@ -0,0 +1,22 @@\n+# 0002. `just` modules, one per tool\n+\n+- Status: Accepted\n+- Date: 2026-10-07\n\
        +\n+## Context\n+Each tool has its own commands (test, lint, format, tool-specific tasks), and\n\
        +the repo needs aggregate commands across all of them. Make's syntax and\n+implicit rules fit badly;\
        \ per-tool shell scripts duplicate argument handling.\n+\n+## Decision\n+Each tool has a `mod.just`;\
        \ the root `justfile` imports each as a module\n+(`just dagster::test`) and defines the aggregates\
        \ (`just test`, `lint`, `fmt`,\n+`fmt-check`). Recipes run in the module's directory. CI calls `uv`\
        \ directly\n+rather than going through `just`.\n+\n+## Consequences\n+`just --list` documents every\
        \ command, and a tool's recipes live beside it.\n+Aggregates must list every tool, so missing wiring\
        \ is a real risk:\n+`.github/scripts/check_wiring.py` fails CI when a tool is missing from any\n\
        +aggregate. Because CI does not go through `just`, a broken recipe is caught\n+only locally; the\
        \ `verify-tool` skill covers that.\ndiff --git a/docs/adr/0003-duckdb-default-target.md b/docs/adr/0003-duckdb-default-target.md\n\
        new file mode 100644\nindex 0000000..8294015\n--- /dev/null\n+++ b/docs/adr/0003-duckdb-default-target.md\n\
        @@ -0,0 +1,23 @@\n+# 0003. duckdb as the credential-free default dbt target\n+\n+- Status: Accepted\n\
        +- Date: 2026-10-07\n+\n+## Context\n+The dbt project targets Snowflake, Postgres, and BigQuery,\
        \ but parsing,\n+linting (sqlfluff's dbt templater compiles the project), tests, and CI all need\n\
        +a warehouse connection. Requiring credentials for any of that would leave CI\n+weaker than local\
        \ work, or require secrets in a public repository.\n+\n+## Decision\n+`profiles.yml` defaults `DBT_TARGET`\
        \ to `duckdb`. Fixture seeds in\n+`seeds/example_raw/` stand in for the raw sources on duckdb only,\
        \ so the whole\n+example project builds and every data and unit test runs with no credentials.\n\
        +Other warehouses are selected explicitly.\n+\n+## Consequences\n+CI builds the full project on\
        \ every dbt change with no secrets. SQL must stay\n+portable, or dispatch per adapter, and Snowflake-only\
        \ features are isolated\n+(`macros/snowflake/`, `models/cost/`) and tested on duckdb fixtures or\
        \ literal\n+inputs. duckdb passing does not prove Snowflake behaviour; those pieces state\n+what\
        \ was not verified live.\ndiff --git a/docs/adr/0004-dbt-env-independent-of-target.md b/docs/adr/0004-dbt-env-independent-of-target.md\n\
        new file mode 100644\nindex 0000000..0350b5f\n--- /dev/null\n+++ b/docs/adr/0004-dbt-env-independent-of-target.md\n\
        @@ -0,0 +1,19 @@\n+# 0004. `dbt_env` var, independent of `target.name`\n+\n+- Status: Accepted\n\
        +- Date: 2026-10-07\n+\n+## Context\n+Macros need dev-versus-prod behaviour: dev schemas, limiting\
        \ data in dev.\n+Branching on `target.name` conflates two things: which warehouse (duckdb,\n+snowflake)\
        \ and which environment (dev, prod). The branches silently never fired,\n+because no target was\
        \ named `prod`, and that bug shipped.\n+\n+## Decision\n+The environment is the `dbt_env` var, defaulting\
        \ to `env_var('DBT_ENV', 'dev')`.\n+Macros branch on `var('dbt_env')`. The target picks the warehouse\
        \ only.\n+\n+## Consequences\n+Any warehouse can run as dev or prod. Property YAML sees `--vars`\
        \ but not the\n+`env_var()` default, so YAML that branches on environment must also check\n+`env_var('DBT_ENV')`\
        \ (see `models/staging/_sources.yml`).\n[3 more file(s) not shown]"
