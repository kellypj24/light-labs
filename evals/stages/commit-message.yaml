# Boss fight: Roll writing a commit message for a real merged PR's diff.
#
# Task class: given the files changed and a capped diff excerpt, write a conventional
# commit message a reviewer can use as-is. Fixtures are PJ's merged PRs from light-labs,
# data-engineering, scouter and temporal-echoes (all public), built by
# `python -m light_labs.evals.commit_message build <repo>:<pr> ...`; each `reference` is
# the squash commit's message, hand-cleaned where history cited other PRs, session links
# or files outside the diff. Scoring is deterministic: flags from commit_message.flags()
# plus the lists below. The mock contestant answers with each reference, so
# `-contestants mock -min-pass 1` proves every reference passes every check.
#
# Run:  just eval commit-message mega-man,bass 3
stage: commit-message
robot: Roll

# Fixed before the first run; recorded on every sample. Procedure: the boss-fight skill.
bar:
  min_fixture_rate: 0.90
  max_gap: 0.05
  reason: >
    Every draft is reviewed before it is committed, but a message that misnames the change
    or invents a reference costs a rewrite; held at the lab default.

defaults:
  max_chars: 1200
  require:
    - subject_format    # type(scope)?: summary, no final period
    - subject_length    # 72 characters or fewer
    - type_fits         # the reference's type or a fair neighbour (input.accept_types;
                        # fix and feat count for each other)
    - has_body          # blank line, then a body
    - no_unknown_files  # every file name it mentions is in the diff
    - no_invented_refs  # no #N or URL the diff does not contain
    - no_trailers       # Co-Authored-By and friends are added later
  must_not_match:
    - "^```"
    - "^\\s*(here'?s|here is|below is)\\b"
    - "^\\s*\\**commit message\\**\\s*:"
    # PJ's style rules (~/.claude/CLAUDE.md)
    - "\\b(robust|seamless(ly)?|delve|tapestry|holistic|crucial|supercharge|game[- ]changer|best[- ]in[- ]class|battle[- ]tested)\\b"
    - "\\bleverag(e|es|ing)\\b"

