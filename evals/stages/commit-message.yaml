      reference: 'ci: run lint + full test suite on push to main


        A squash-merge can land before PR checks finish,

        and the CI workflow was pull_request-only — so nothing re-verified main

        afterward. Add a push trigger as a post-merge backstop.


        Diff-based test targeting cannot work on push: `github.base_ref` is

        empty, so `BASE_REF` is set to "" and the `os.environ.get(..., "main")`

        default never applies, leaving `git diff origin/...HEAD` malformed. On

        push we skip the resolver and run the full suite with the 80% coverage

        floor enforced, which is the appropriate depth for a backstop anyway.


        The staleness job stays pull_request-only: it asks whether docs

        accompanied a change, which is a review-time question, and it diffs

        against the PR base that a push does not have.


