# Who fights. Roles follow the README's eval loop:
#   mega-man - the local generalist: the model a robot runs on today
#   proto    - the challenger: a candidate local model trying to take Mega Man's slot
#   bass     - the cloud baseline: the ceiling Mega Man is measured against
#   mock     - no model; CI uses it to test the harness wiring only
contestants:
  - name: mega-man
    role: mega-man
    brain: ollama:llama3.1:8b
  - name: proto
    role: proto
    brain: ollama:gemma3:4b
  # The challenger for code stages such as dbt-model.
  - name: proto-coder
    role: proto
    brain: ollama:qwen2.5-coder:7b
  # The largest model that fits PJ's 16 GB M1 Pro (about 9 GB loaded, alone).
  - name: proto-14b
    role: proto
    brain: ollama:qwen2.5:14b
  - name: bass
    role: bass
    brain: claude:sonnet
  - name: mock
    role: mock
    brain: mock
