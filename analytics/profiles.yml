light_labs:
  target: duckdb
  outputs:
    # The lab's own database: `lab evals ingest` writes raw.*, dbt builds the rest
    # beside it. DUCKDB_PATH points CI and tests at a throwaway file.
    duckdb:
      type: duckdb
      # LAB_VAR: a deployed release (`lab deploy lab`) builds into the checkout's var/.
      path: "{{ env_var('DUCKDB_PATH', env_var('LAB_VAR', '../var') ~ '/lab.duckdb') }}"
      threads: 4
