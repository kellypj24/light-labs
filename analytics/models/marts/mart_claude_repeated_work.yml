version: 2

models:
  - name: mart_claude_repeated_work
    description: >
      One row per repeated kind of work: a shell command pattern, a skill or a subagent
      type. Sort by session_count or project_count to find candidates for a skill or robot.
    columns:
      - name: work_key
        description: work_kind | pattern
        tests:
          - unique
          - not_null
      - name: work_kind
        description: bash, skill or subagent
        tests:
          - accepted_values:
              arguments:
                values: ["bash", "skill", "subagent"]
      - name: pattern
        description: >
          bash: first word, plus the subcommand if the second word is one (`git status`,
          `uv run`), after a leading `cd <dir> &&`; skill: its name; subagent: its type
      - name: week_count
        description: Distinct weeks it was used in

unit_tests:
  - name: command_patterns
    description: A leading cd is dropped; a subcommand is kept, a flag or path is not.
    model: mart_claude_repeated_work
    given:
      - input: ref('int_claude_tool_calls')
        rows:
          - {tool_use_id: t1, tool_name: Bash, bash_command: "cd /w/app && git status --short", session_id: s1, project: app, called_at: "2026-10-12 10:00:00+00", is_error: false}
          - {tool_use_id: t2, tool_name: Bash, bash_command: "git status", session_id: s2, project: lib, called_at: "2026-10-20 10:00:00+00", is_error: true}
          - {tool_use_id: t3, tool_name: Bash, bash_command: "ls -la /tmp", session_id: s1, project: app, called_at: "2026-10-12 10:00:00+00", is_error: false}
          - {tool_use_id: t4, tool_name: Skill, skill_name: ship-pr, session_id: s1, project: app, called_at: "2026-10-12 10:00:00+00", is_error: false}
    expect:
      rows:
        - {work_key: "bash|git status", call_count: 2, session_count: 2, project_count: 2, week_count: 2, error_count: 1}
        - {work_key: "bash|ls", call_count: 1, session_count: 1, project_count: 1, week_count: 1, error_count: 0}
        - {work_key: "skill|ship-pr", call_count: 1, session_count: 1, project_count: 1, week_count: 1, error_count: 0}
