version: 2

models:
  - name: mart_training_weekly
    description: One row per ISO week from the first session to this week, with training load.
    columns:
      - name: week_start
        description: Monday of the ISO week, local time
        tests:
          - unique
          - not_null
      - name: iso_week
        description: e.g. 2026-W45
      - name: load_as_of
        description: Day the load columns are measured at; the week's Sunday, or today
      - name: acute_minutes
        description: Training and noted chore minutes in the 7 days to load_as_of
      - name: chronic_weekly_minutes
        description: Training and noted chore minutes in the 28 days to load_as_of, divided by 4
      - name: acute_chronic_ratio
        description: acute / chronic; NULL with no chronic load. Above 1.3 the planner deloads
      - name: tonnage_lb
        description: Working-set tonnage (added weight × reps); bodyweight lifts add none
      - name: training_minutes
        description: Lifting plus cardio minutes
      - name: chore_minutes
        description: Minutes of chores PJ noted that week; they count in the load columns
