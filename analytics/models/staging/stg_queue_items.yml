version: 2

models:
  - name: stg_queue_items
    description: One row per draft a robot queued for approval.
    columns:
      - name: queue_item_key
        description: robot | item_id
        tests:
          - unique
          - not_null
      - name: robot
        description: Robot directory under var/, e.g. rush
      - name: status
        description: pending, sent or rejected
      - name: kind
        description: reply (direct message) or comment (board task)
      - name: is_escalated
        description: The draft was escalated to Auto (its text is a holding reply)
      - name: sent_text
        description: The text as it stands; for sent items, what was posted
      - name: drafted_text
        description: What the robot wrote; NULL on items queued before it was recorded
      - name: is_edited
        description: Sent text differs from the draft; NULL if unknown or not sent
      - name: edit_similarity
        description: 1 - Levenshtein distance / longer length, sent vs drafted; 1.0 is unedited
      - name: minutes_to_decision
        description: Minutes from queued to sent or rejected; NULL while pending
      - name: reject_reason
        description: Reason given to `lab rush reject --reason`
      - name: brain
        description: Model spec that drafted it, e.g. ollama:llama3.1:8b
      - name: git_commit
        description: Lab commit that drafted it

unit_tests:
  - name: edits_and_decisions
    description: Edited vs unedited vs unknown, and decision time.
    model: stg_queue_items
    given:
      - input: source('raw', 'queue_items')
        rows:
          - {item_id: a, robot: rush, status: sent, draft: "hi there", drafted: "hi there", escalation: null, created: "2026-10-12 10:00:00+00", resolved: "2026-10-12 10:30:00+00"}
          - {item_id: b, robot: rush, status: sent, draft: "hello there", drafted: "hi there", escalation: null, created: "2026-10-12 10:00:00+00", resolved: "2026-10-12 11:00:00+00"}
          - {item_id: c, robot: rush, status: sent, draft: "hi", drafted: null, escalation: "do work", created: "2026-10-12 10:00:00+00", resolved: "2026-10-12 10:05:00+00"}
          - {item_id: d, robot: rush, status: pending, draft: "hi", drafted: "hi", escalation: null, created: "2026-10-12 10:00:00+00", resolved: null}
    expect:
      rows:
        - {queue_item_key: rush|a, is_edited: false, edit_similarity: 1.0, minutes_to_decision: 30, is_escalated: false}
        - {queue_item_key: rush|b, is_edited: true, edit_similarity: 0.6363636363636364, minutes_to_decision: 60, is_escalated: false}
        - {queue_item_key: rush|c, is_edited: null, edit_similarity: null, minutes_to_decision: 5, is_escalated: true}
        - {queue_item_key: rush|d, is_edited: null, edit_similarity: null, minutes_to_decision: null, is_escalated: false}
