version: 2

sources:
  - name: raw
    description: Landed by `lab evals ingest` from the eval runner's JSONL files.
    schema: raw
    tables:
      - name: eval_samples
        description: >
          One row per scored sample: one contestant's attempt at one fixture. Columns
          the runner added later (run_id, commit, dirty, filter) are NULL on older runs.
        columns:
          - name: run_id
            tests:
              - not_null
          - name: contestant
            tests:
              - not_null
          - name: fixture
            tests:
              - not_null
      - name: queue_items
        description: >
          Robots' approval queues, one row per queued draft, reloaded in full by
          `lab queue ingest` from var/<robot>/queue/{pending,sent,rejected}/. `drafted`
          (the robot's original text) and brain/commit are NULL on items queued before
          they were recorded.
        columns:
          - name: item_id
            tests:
              - not_null
          - name: status
            tests:
              - accepted_values:
                  arguments:
                    values: ["pending", "sent", "rejected"]
      - name: eval_run_log
        description: >
          One row per eval run from the runner's <run_id>.run.json: lifecycle (running,
          completed, cancelled), reason, progress, cooling pauses. Reloaded in full by
          `lab evals ingest`. Runs before 2026-10-13 have no record.
        columns:
          - name: run_id
            tests:
              - not_null
      - name: eval_telemetry
        description: >
          Heat and load readings the runner takes every 30 seconds during a run
          (<run_id>.telemetry.jsonl): battery temperature and charge, AC power, CPU speed
          limit, load, Ollama's CPU. NULL where the platform has no reading.
      - name: claude_records
        description: >
          Every line of Claude Code's session transcripts (~/.claude/projects), appended by
          `lab claude ingest` and never deleted, so sessions outlive Claude Code's 30-day
          cleanup. `record` is the line as written; subagents' transcripts sit under
          <session>/subagents/.
        columns:
          - name: record_key
            tests:
              - unique
              - not_null
      - name: shadow_pairs
        description: >
          One local yes/no answer's raw probability against the label it should have had
          (Claude's verdict, or a ground truth such as a PR title's type). Reloaded in full
          by `lab calibration ingest` from var/<robot>/pairs/*.jsonl and Roll's Dependabot
          queue; brain is NULL on answers recorded before it was. Eval fixtures are left out.
        columns:
          - name: robot
            tests:
              - not_null
          - name: question
            tests:
              - not_null
      - name: calibration_maps
        description: >
          One map per robot, question and brain, fitted by `lab calibration ingest`:
          Platt or isotonic when it beats the raw probability on held-out Brier score,
          else identity (too few pairs, one class, or no gain). Brier and ECE before and
          after; the held-out numbers are NULL for identity maps that never fitted.
        columns:
          - name: method
            tests:
              - accepted_values:
                  arguments:
                    values: ["platt", "isotonic", "identity"]
      - name: strong_sets
        description: >
          Every set in PJ's newest Strong export, reloaded in full by `lab training
          ingest-strong` (each export holds the whole history). Rest-timer rows are
          dropped; set_number is the set's position within its exercise, because Strong
          writes a letter (W, D, F) in place of the number for warm-up, drop and failure
          sets. Weights are in `unit` (lb); the export has no unit column.
        columns:
          - name: set_id
            tests:
              - unique
              - not_null
          - name: set_type
            tests:
              - accepted_values:
                  arguments:
                    values: ["normal", "warmup", "drop", "failure"]
      - name: training_notes
        description: >
          One row per thing one of PJ's training notes said (`/note` in Rush's chat),
          reloaded in full by `lab training ingest-notes` from
          var/training/notes/notes.jsonl. Voided notes are kept and flagged. `note_text`
          and `what` are his words; the marts never select them.
        columns:
          - name: note_id
            tests:
              - not_null
          - name: note_date
            tests:
              - not_null
      - name: training_plan_days
        description: >
          One row per day of each weekly plan, reloaded in full by `lab training
          ingest-plans` from var/training/plans/*.json.
        columns:
          - name: plan_date
            tests:
              - unique
              - not_null
      - name: health_workouts
        description: >
          Apple Health workouts (Strava writes rides and runs to Health), upserted by
          HealthKit uuid by `lab training ingest-health` from the exports PJ's Shortcut
          sends to Rush. Every record is kept, including accidental starts and the same
          run recorded twice; staging flags those. `statistics` holds every statistic
          as exported; the named columns are the ones the marts use.
        columns:
          - name: workout_uuid
            tests:
              - unique
              - not_null
          - name: activity_type
            tests:
              - not_null
