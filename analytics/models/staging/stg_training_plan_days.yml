version: 2

models:
  - name: stg_training_plan_days
    description: One row per day of each weekly training plan.
    columns:
      - name: plan_date
        tests:
          - unique
          - not_null
      - name: plan_week
        description: Monday of the plan's ISO week
        tests:
          - not_null
      - name: is_training
        description: A session is planned that day (not a rest day)
        tests:
          - not_null
      - name: planned_minutes
        description: Length of the planned slot; NULL on rest days
