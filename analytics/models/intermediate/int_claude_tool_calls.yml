version: 2

models:
  - name: int_claude_tool_calls
    description: One row per tool call, main loop and subagents, with its result.
    columns:
      - name: tool_use_id
        tests:
          - unique
          - not_null
      - name: tool_name
        description: Bash, Read, Edit, Agent, mcp__<server>__<tool>, ...
      - name: tool_input
        description: The call's input, JSON
      - name: bash_command
        description: The command, for Bash calls
      - name: project
        description: The project the call touched (file path, cd or -C target), else the cwd's
      - name: worktree
        description: The checkout within the project the call touched, as in stg_claude_records
      - name: activity
        description: reading, editing, shell, web, subagents, asking or other
        tests:
          - accepted_values:
              arguments:
                values: ["reading", "editing", "shell", "web", "subagents", "asking", "other"]
      - name: skill_name
        description: The skill, for Skill calls
      - name: subagent_type
        description: The agent type, for Agent calls
      - name: mcp_server
        description: The MCP server, for mcp__ tools; empty otherwise
      - name: is_answered
        description: A result came back; false when interrupted or still running
      - name: is_error
        description: The result was an error (including a denied permission)
      - name: duration_seconds
        description: Call to result, permission prompts included; NULL without a result

unit_tests:
  - name: project_from_what_the_call_touched
    description: >
      A file path or a cd/-C target decides the project, a worktree folds into its repo,
      and a call that names no path keeps the shell's working directory.
    model: int_claude_tool_calls
    given:
      - input: ref('stg_claude_records')
        rows:
          - {record_type: assistant, session_id: s, is_subagent: false, project: claude-config, folder: claude-config, worktree: null, recorded_at: "2026-10-12 10:00:00+00", message_content: '[{"type": "tool_use", "id": "t1", "name": "Read", "input": {"file_path": "/Users/u/light-labs/README.md"}}]'}
          - {record_type: assistant, session_id: s, is_subagent: false, project: claude-config, folder: claude-config, worktree: null, recorded_at: "2026-10-12 10:00:01+00", message_content: '[{"type": "tool_use", "id": "t2", "name": "Bash", "input": {"command": "cd ~/light-labs-bar && just check"}}]'}
          - {record_type: assistant, session_id: s, is_subagent: false, project: claude-config, folder: claude-config, worktree: null, recorded_at: "2026-10-12 10:00:02+00", message_content: '[{"type": "tool_use", "id": "t3", "name": "Bash", "input": {"command": "git -C /Users/u/scouter status"}}]'}
          - {record_type: assistant, session_id: s, is_subagent: false, project: claude-config, folder: claude-config, worktree: null, recorded_at: "2026-10-12 10:00:03+00", message_content: '[{"type": "tool_use", "id": "t4", "name": "Bash", "input": {"command": "ls"}}]'}
          - {record_type: system, session_id: s, is_subagent: false, project: light-labs, folder: light-labs-bar, worktree: light-labs-bar, recorded_at: "2026-10-12 09:00:00+00", message_content: null}
    expect:
      rows:
        - {tool_use_id: t1, project: light-labs, worktree: light-labs}
        - {tool_use_id: t2, project: light-labs, worktree: light-labs-bar}
        - {tool_use_id: t3, project: scouter, worktree: scouter}
        - {tool_use_id: t4, project: claude-config, worktree: null}
