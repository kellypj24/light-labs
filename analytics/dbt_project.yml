# Eval analytics: raw eval samples (`lab evals ingest`) → staging → intermediate → marts.
# Layout and conventions follow ~/data-engineering/transformation/dbt.
name: light_labs
version: "1.0.0"

require-dbt-version: ">=1.10.0"

profile: light_labs

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Defaults for stages without a `bar:` (and runs made before bars were recorded).
  # A stage's weapon is earned when the local generalist (role mega-man) clears this
  # fixture pass rate (every sample of a fixture must pass) on its latest run...
  weapon_min_fixture_rate: 0.9
  # ...and trails the cloud baseline (role bass) by no more than this.
  weapon_max_gap: 0.05

  # A robot's draft kind is ready to skip approval when, over its last
  # `autonomy_window` decisions (all of them required), at least
  # `autonomy_min_unedited_rate` were sent exactly as drafted. Edits unknown (items
  # queued before `drafted` was recorded) count as not unedited.
  autonomy_window: 30
  autonomy_min_unedited_rate: 0.95

  # mart_run_health: a run still "running" with no reading for this long was killed.
  run_stale_minutes: 10

  # Training (docs/plans/training.md). A bodyweight lift (pull up, dip) logged at or
  # above this weight logged PJ's bodyweight, not added weight: it progresses on reps
  # and stays out of tonnage.
  training_bodyweight_threshold_lb: 100
  # e1RM (Epley) only from sets of at most this many reps.
  training_e1rm_max_reps: 10
  # Health workouts Strong already covers (Strong writes its sessions to Health).
  training_strength_activity_types: ["traditionalStrengthTraining", "functionalStrengthTraining"]
  training_timezone: America/New_York

models:
  light_labs:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  light_labs:
    +schema: seeds
    strong_exercises:
      +column_types:
        exercise: varchar
        movement_pattern: varchar
        is_bodyweight_lift: boolean
