# One hook set for local commits and CI (`just check` runs the same thing).
# A hook that rewrites a file fails the run, so CI never passes on an auto-fix.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  # Static analysis of the GitHub Actions workflows themselves.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (full history)
        entry: scripts/gitleaks.sh
        language: script
        pass_filenames: false
        always_run: true
