name: CI

on:
  pull_request:
    branches: [main]
  # Post-merge backstop: re-verify main after every squash-merge.
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: no token scopes by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.0"
  UV_LOCKED: "1" # every uv command fails if uv.lock is out of date

jobs:
  # Which gated jobs this PR needs. Pushes to main and manual runs get everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      evals: ${{ steps.diff.outputs.evals }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          patterns=$(grep -v -e '^#' -e '^$' .github/eval-paths.txt | sed 's/[.]/\\./g; s/^/^/')
          if git diff --name-only HEAD^1 HEAD | grep -q -E -e "$patterns"; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi

  # The repo's pre-commit hooks: hygiene, ruff, zizmor and gitleaks. Same set
  # and versions as a local commit, so a green local run is a green CI run.
  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: pre-commit
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Sync
        run: uv sync
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t . -v

  # Eval harness wiring: Go vet/test/format, then a full smoke run against the mock
  # contestant. Real models never run in CI (see docs/ci-cd.md); the smoke run fails
  # only if a sample could not run, never on the mock's scores. Skipped on PRs that touch
  # nothing in .github/eval-paths.txt.
  evals:
    name: Eval harness
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evals/go.mod
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Smoke run (mock contestant)
        run: go run . -contestants mock -samples 1 -out "$RUNNER_TEMP/evals"
      # The mock answers each dbt-model fixture with its reference: every reference
      # must build and score 100%.
      - name: Oracle run (dbt-model)
        run: go run . -stage dbt-model -contestants mock -samples 1 -min-pass 1 -out "$RUNNER_TEMP/evals"
      # The mock answers each commit-message fixture with its reference: every reference
      # must pass every check.
      - name: Oracle run (commit-message)
        run: go run . -stage commit-message -contestants mock -samples 1 -min-pass 1 -out "$RUNNER_TEMP/evals"
      # mail-keep wiring: every fixture loads and runs; the mock's scores don't count.
      - name: Smoke run (mail-keep)
        run: go run . -stage mail-keep -contestants mock -samples 1 -out "$RUNNER_TEMP/evals"

  # dbt project: lint, then ingest the synthetic fixtures into a throwaway DuckDB
  # file and build every model, data test and unit test over them. Same steps as
  # `just analytics-check`.
  analytics:
    name: Analytics (dbt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/analytics
      LAB_VAR: ${{ github.workspace }}/var-ci
      DUCKDB_PATH: ${{ github.workspace }}/var-ci/lab.duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Sync
        run: uv sync --group analytics
      - name: sqlfluff
        working-directory: analytics
        run: uv run sqlfluff lint models macros
      - name: Ingest fixtures
        run: |
          uv run lab evals ingest analytics/fixtures/*.jsonl
          uv run lab queue ingest --root analytics/fixtures/queue
          uv run lab claude ingest --projects analytics/fixtures/claude/projects
      - name: dbt build
        working-directory: analytics
        run: uv run dbt build
      - name: Runs mart
        run: uv run lab evals runs
      - name: Tests that need the analytics group
        run: uv run python -m unittest tests.test_dbt_model tests.test_autosend tests.test_commit_message -v

  # Orchestration (Dagster): definitions load, invariants hold, and the analytics job
  # builds over the synthetic fixtures. Same steps as `just dagster-check`.
  orchestration:
    name: Orchestration (Dagster)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Sync
        run: uv sync --group orchestration
      - name: dbt parse
        working-directory: analytics
        run: uv run dbt parse --quiet
      - name: Validate definitions
        run: uv run dagster definitions validate -m light_labs.orchestration
      - name: Tests
        run: uv run python -m unittest tests.test_orchestration -v

  # The single required status check. Jobs that legitimately skip are fine;
  # any failure or cancellation fails this. Add every new job to `needs`.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    permissions: {}
    needs: [changes, hooks, test, evals, analytics, orchestration]
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "$NEEDS"
          exit 1
      - run: echo "All required jobs passed or were skipped."
